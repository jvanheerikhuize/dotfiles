# Feature Specification: Base Shell Dotfiles
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0003"
  title: "Base Shell Dotfile Content"
  version: "1.0.0"
  status: "draft"
  priority: "high"
  author: "Jerry"
  created_at: "2026-02-25"
  updated_at: "2026-02-25"
  tags:
    - dotfiles
    - bash
    - shell
    - git

description:
  summary: |
    Add actual dotfile content to the dotfiles/ directory: .bashrc, .bash_aliases,
    .bash_profile, and .gitconfig. These are the core shell and git configuration
    files symlinked into $HOME by the mechanism from FEAT-0001.

  problem_statement: |
    FEAT-0001 provides the symlinking mechanism but dotfiles/ is empty — there is
    nothing to actually link. Without real dotfile content, a provisioned machine has
    no personalised shell environment, no aliases, and no git configuration.

  proposed_solution: |
    Populate dotfiles/ with curated, well-commented configuration files:
    - .bashrc: prompt (PS1), history settings, colour, PATH additions, source of .bash_aliases
    - .bash_aliases: common developer aliases (ls, git shortcuts, navigation)
    - .bash_profile: login shell setup; sources .bashrc
    - .gitconfig: core settings (editor, default branch, colour), merge strategy, useful aliases
    Git identity (user.name, user.email) is NOT stored in .gitconfig (handled in FEAT-0008).
    All files must be idempotent to link and must not break bash on a stock Ubuntu 22.04.

  out_of_scope:
    - "zsh, fish, or any non-bash shell (separate spec)"
    - "Neovim / Vim config content (separate spec)"
    - "Tmux config (separate spec)"
    - "Git identity (user.name, user.email) — covered in FEAT-0008"
    - "Tool-specific configs (.npmrc, .pypirc, etc.) — separate specs"

  dependencies:
    - "FEAT-0001: Core provisioning engine (symlink mechanism)"

acceptance_criteria:
  - id: "AC-001"
    given: "The dotfiles/ directory contains .bashrc, .bash_aliases, .bash_profile, and .gitconfig"
    when: "./install.sh --profile base is run"
    then: "All four files are symlinked into $HOME"
    and:
      - "~/.bashrc -> <repo>/dotfiles/.bashrc"
      - "~/.bash_aliases -> <repo>/dotfiles/.bash_aliases"
      - "~/.bash_profile -> <repo>/dotfiles/.bash_profile"
      - "~/.gitconfig -> <repo>/dotfiles/.gitconfig"

  - id: "AC-002"
    given: "A fresh bash session after provisioning"
    when: "The user opens a terminal"
    then: "bash sources ~/.bashrc without errors"
    and:
      - "The custom PS1 prompt is displayed"
      - "'ls' uses colour output"
      - "~/.bash_aliases is sourced and aliases are available"
      - "bash history is set to 10000 lines with timestamps"
      - "HISTCONTROL=ignoredups:erasedups is set"

  - id: "AC-003"
    given: "The .bash_aliases file is symlinked"
    when: "The user opens a terminal"
    then: "The following aliases are available:"
    and:
      - "ll='ls -alFh' — long listing with human-readable sizes"
      - "la='ls -A' — show hidden files"
      - "grep='grep --color=auto'"
      - "gs='git status'"
      - "ga='git add'"
      - "gc='git commit'"
      - "gp='git push'"
      - "gl='git log --oneline --graph --decorate'"
      - "..='cd ..'"
      - "../..='cd ../..'"

  - id: "AC-004"
    given: "The .gitconfig is symlinked"
    when: "The user runs a git command"
    then: "git uses the configured defaults:"
    and:
      - "core.editor = vim"
      - "init.defaultBranch = main"
      - "color.ui = auto"
      - "pull.rebase = false"
      - "push.autoSetupRemote = true"
      - "alias.st = status"
      - "alias.co = checkout"
      - "alias.br = branch"
      - "alias.lg = log --oneline --graph --decorate --all"

  - id: "AC-005"
    given: "The dotfiles/ directory is the git repo itself"
    when: "A dotfile is edited"
    then: "The change is immediately reflected in $HOME (because it is a symlink) and is tracked by git"

technical_requirements:
  constraints:
    - "Dotfiles must not assume any tools beyond what Ubuntu 22.04 installs by default"
    - ".bashrc must not break if sourced in a non-interactive shell (guard with [[ $- == *i* ]] or equivalent)"
    - ".gitconfig must not contain user.name or user.email — those are set in FEAT-0008"
    - "All config files must be extensively commented so their purpose is self-documenting"

testing_requirements:
  unit_tests: false
  integration_tests: true
  e2e_tests: true
  test_scenarios:
    - "bash --login exits 0 after provisioning (no syntax errors in .bash_profile or .bashrc)"
    - "bash -i -c 'type ll' shows the alias after sourcing .bashrc"
    - "git config --list shows expected defaults after .gitconfig is linked"
    - "Editing a dotfile in the repo is immediately visible via the symlink in $HOME"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    Remove symlinks with: rm ~/.bashrc ~/.bash_aliases ~/.bash_profile ~/.gitconfig
    Original files were backed up to .bak during install if --force was used.
