# Feature Specification: Log to File
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0012"
  title: "Log to File"
  version: "1.0.0"
  status: "draft"
  priority: "medium"
  author: "Jerry"
  created_at: "2026-02-25"
  updated_at: "2026-02-25"
  tags:
    - logging
    - observability
    - debugging

description:
  summary: |
    Tee all install.sh output to a timestamped log file in ~/.local/logs/dotfiles/
    so that provisioning runs are auditable and failures can be debugged after the fact.

  problem_statement: |
    When a provisioning run fails or produces unexpected behaviour, all output is lost
    once the terminal is closed. There is no record of which packages were installed,
    what warnings occurred, or what the exact error was. This makes debugging failed
    provisioning runs (especially unattended ones) very difficult.

  proposed_solution: |
    At the start of install.sh, create a log file at:
      ~/.local/logs/dotfiles/YYYY-MM-DD_HH-MM-SS.log
    All subsequent output (stdout + stderr) is tee'd to this file using bash's
    'exec > >(tee -a "$LOGFILE") 2>&1' pattern. At the end of the run, the log file
    path is printed. Keep the last 10 log files and prune older ones automatically.

  out_of_scope:
    - "Centralised log shipping or remote log collection"
    - "Structured (JSON) log format — plain text is sufficient"

  dependencies:
    - "FEAT-0001: Core provisioning engine"

acceptance_criteria:
  - id: "AC-001"
    given: "A normal install.sh run"
    when: "install.sh starts"
    then: "A log file is created at ~/.local/logs/dotfiles/YYYY-MM-DD_HH-MM-SS.log"
    and:
      - "All stdout and stderr output is written to both the terminal and the log file"
      - "The log file path is printed at the very start: 'Logging to: ~/.local/logs/dotfiles/<file>'"

  - id: "AC-002"
    given: "install.sh completes (success or failure)"
    when: "The run ends"
    then: "The log file contains the complete run output including the summary (FEAT-0007)"
    and:
      - "The final line of the log is either 'Run complete' or the error that caused exit 1"

  - id: "AC-003"
    given: "More than 10 log files exist in ~/.local/logs/dotfiles/"
    when: "A new run starts"
    then: "The oldest log files are deleted so that at most 10 are retained"

  - id: "AC-004"
    given: "install.sh is run with --no-log"
    when: "The run completes"
    then: "No log file is created and no log directory is created"

  - id: "AC-005"
    given: "The log directory does not exist"
    when: "install.sh starts"
    then: "~/.local/logs/dotfiles/ is created with mkdir -p"

technical_requirements:
  constraints:
    - "Implemented using 'exec > >(tee -a \"$LOGFILE\") 2>&1' in install.sh before any other output"
    - "Log rotation (keep last 10) implemented with ls -t and tail + xargs rm"
    - "Log directory is ~/.local/logs/dotfiles/ — no sudo required"

testing_requirements:
  unit_tests: false
  integration_tests: false
  e2e_tests: true
  test_scenarios:
    - "Log file created with correct timestamped filename"
    - "Log file contains full run output"
    - "Log file contains output from failed runs"
    - "Old logs pruned when more than 10 exist"
    - "--no-log: no log file created"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    Remove log directory: rm -rf ~/.local/logs/dotfiles/
    No impact on system state.
