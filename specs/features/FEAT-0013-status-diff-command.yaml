# Feature Specification: Status / Diff Command
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0013"
  title: "Status / Diff Command"
  version: "1.0.0"
  status: "draft"
  priority: "medium"
  author: "Jerry"
  created_at: "2026-02-25"
  updated_at: "2026-02-25"
  tags:
    - ux
    - status
    - diff
    - drift-detection

description:
  summary: |
    Add a --status flag to install.sh that compares the current state of the system
    against a profile's declared packages and dotfiles, reporting what is installed,
    what is missing, and what dotfiles are correct, missing, or conflicted — without
    making any changes.

  problem_statement: |
    After a machine has been running for a while, it drifts from its declared profile:
    packages get manually installed or removed, dotfiles get edited directly in $HOME
    rather than in the repo. There is no way to see this drift without running the
    full provisioner (which makes changes) or manually checking each package.

  proposed_solution: |
    ./install.sh --profile base --status runs the full resolution (load profile, merge
    extends) and then for each declared package checks its installation state, and for
    each dotfile checks its symlink state. Results are printed in a status table with
    colour-coded symbols:
      ✓ installed / correctly linked
      ✗ missing / not installed
      ! conflict (file exists but is not a symlink, or symlink points elsewhere)
    Exits 0 if everything matches the profile; exits 1 if any item is missing or conflicted.

  out_of_scope:
    - "Detecting packages installed on the system but NOT in the profile (reverse drift)"
    - "Detecting dconf drift (FEAT-0011 scope)"
    - "Automatic remediation (use install.sh without --status for that)"

  dependencies:
    - "FEAT-0001: Core provisioning engine"
    - "FEAT-0002: Multi-type package support (for checking snap/flatpak status)"

acceptance_criteria:
  - id: "AC-001"
    given: "A system where all profile packages are installed and all dotfiles correctly linked"
    when: "./install.sh --profile base --status is run"
    then: "All items show ✓ and the script exits 0"
    and:
      - "Output header: 'Status: base profile — all items match'"

  - id: "AC-002"
    given: "A system missing one or more packages declared in the profile"
    when: "./install.sh --profile base --status is run"
    then: "Missing packages show ✗ and the script exits 1"
    and:
      - "Each missing package is listed as: '✗ [apt] curl — not installed'"
      - "A summary line: '1 item(s) missing — run ./install.sh to provision'"

  - id: "AC-003"
    given: "A $HOME dotfile exists as a regular file instead of a symlink to the repo"
    when: "./install.sh --status is run"
    then: "The conflicted dotfile shows ! with reason"
    and:
      - "'! ~/.bashrc — file exists (not a symlink); use --force to replace'"
      - "Exit code is 1"

  - id: "AC-004"
    given: "A $HOME dotfile symlink pointing to the wrong target"
    when: "./install.sh --status is run"
    then: "The dotfile shows ! with: '! ~/.bashrc — symlink exists but points to wrong target'"

  - id: "AC-005"
    given: "A profile with extends inheritance"
    when: "./install.sh --profile dev --status is run"
    then: "All packages across the full chain (base + desktop + dev) are checked"
    and:
      - "The profile chain is printed: 'Checking profile: dev (base → desktop → dev)'"

  - id: "AC-006"
    given: "The --status flag"
    when: "Combined with --profile"
    then: "Only the specified profile (and its chain) is checked"

technical_requirements:
  constraints:
    - "Read-only: no changes to system state"
    - "Must work without internet (checks local package state only)"
    - "Colour output uses ANSI codes; respects NO_COLOR env variable"
    - "Exit code 0 = everything matches, 1 = at least one item missing or conflicted"

testing_requirements:
  unit_tests: false
  integration_tests: false
  e2e_tests: true
  test_scenarios:
    - "All packages installed + dotfiles linked: exit 0, all ✓"
    - "One package missing: exit 1, ✗ shown for that package"
    - "Dotfile exists as regular file: exit 1, ! shown"
    - "Dotfile symlink to wrong target: exit 1, ! shown"
    - "Dev profile checks full chain"
    - "NO_COLOR=1: output has no ANSI codes"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    Read-only operation. No rollback needed.
