# Feature Specification: Docker Smoke Test Suite
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0004"
  title: "Docker Smoke Test Suite"
  version: "1.0.0"
  status: "draft"
  priority: "medium"
  author: "Jerry"
  created_at: "2026-02-25"
  updated_at: "2026-02-25"
  tags:
    - testing
    - docker
    - ci
    - smoke-test

description:
  summary: |
    A Docker-based smoke test suite that runs install.sh against a clean Ubuntu 22.04
    container and verifies the result. Covers idempotency, all profiles, and all
    package types.

  problem_statement: |
    Without automated tests there is no way to verify that install.sh actually works
    on a clean system, that profiles install correctly, or that changes haven't broken
    idempotency. Testing on a real machine is slow, destructive, and hard to repeat.

  proposed_solution: |
    A tests/smoke/ directory with:
    - A Dockerfile (FROM ubuntu:22.04) that bootstraps git + the repo
    - A test runner script (tests/smoke/run-tests.sh) that builds the image and
      runs scenarios using docker run
    - Individual test scripts per scenario that assert expected state after install.sh
    Tests use a lightweight assertion pattern (assert_cmd_success, assert_file_exists,
    assert_symlink, assert_pkg_installed). The suite is also runnable in CI via
    a GitHub Actions workflow trigger.

  out_of_scope:
    - "Full integration tests of every package in every profile (too slow)"
    - "Performance benchmarking"
    - "Testing on Ubuntu versions older than 22.04"
    - "bats/shellspec unit test framework (separate concern)"

  dependencies:
    - "FEAT-0001: Core provisioning engine"
    - "FEAT-0002: Multi-type package support (for multi-type scenarios)"
    - "FEAT-0003: Base shell dotfiles (for dotfile scenarios)"

acceptance_criteria:
  - id: "AC-001"
    given: "Docker is available on the host machine"
    when: "tests/smoke/run-tests.sh is executed"
    then: "A clean Ubuntu 22.04 Docker image is built and all test scenarios are run"
    and:
      - "Pass/fail status is printed per scenario"
      - "Overall exit code is 0 if all pass, non-zero if any fail"

  - id: "AC-002"
    given: "A clean Ubuntu 22.04 container with the repo cloned"
    when: "./install.sh --profile base is run inside the container"
    then: "All apt packages listed in profiles/base.yaml are installed"
    and:
      - "Script exits 0"
      - "'dpkg -s <package>' exits 0 for each declared package"

  - id: "AC-003"
    given: "install.sh --profile base has already run successfully in the container"
    when: "./install.sh --profile base is run a second time"
    then: "The script exits 0 with no errors"
    and:
      - "No packages are re-installed (apt output shows 'already the newest version')"
      - "No symlink errors are produced"

  - id: "AC-004"
    given: "A clean container"
    when: "./install.sh --profile base is run"
    then: "Dotfile symlinks are created in $HOME"
    and:
      - "'test -L ~/.bashrc' exits 0"
      - "'readlink ~/.bashrc' points to the repo's dotfiles/.bashrc"

  - id: "AC-005"
    given: "The test suite"
    when: "run-tests.sh is invoked with --profile <name>"
    then: "Only the scenarios for that profile are run"

  - id: "AC-006"
    given: "A GitHub Actions workflow file at .github/workflows/smoke-tests.yml"
    when: "A pull request is opened"
    then: "The smoke test suite runs automatically and reports pass/fail on the PR"

technical_requirements:
  constraints:
    - "Tests must complete in under 10 minutes total for the base profile scenario"
    - "Docker image must be rebuilt from scratch (no cache) for each full test run to ensure clean state"
    - "Test scripts must not leave persistent Docker images or containers behind after completion"

  security:
    - "Containers run without --privileged unless snap testing requires it"
    - "No host volumes mounted during tests (repo is cloned inside the container)"

testing_requirements:
  unit_tests: false
  integration_tests: false
  e2e_tests: true
  test_scenarios:
    - "Base profile: all apt packages installed"
    - "Base profile: idempotency (second run exits 0)"
    - "Base profile: dotfile symlinks created"
    - "Base profile: bash --login exits 0 (no .bashrc errors)"
    - "install.sh --help exits 0 and prints usage"
    - "install.sh with unknown --profile name exits non-zero"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    Tests are read-only and run in throwaway containers. No rollback needed.
    Remove Docker images with: docker image prune -f
