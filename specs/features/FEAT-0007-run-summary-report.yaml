# Feature Specification: Run Summary Report
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0007"
  title: "Run Summary Report"
  version: "1.0.0"
  status: "draft"
  priority: "medium"
  author: "Jerry"
  created_at: "2026-02-25"
  updated_at: "2026-02-25"
  tags:
    - ux
    - logging
    - reporting

description:
  summary: |
    Print a structured summary table at the end of every install.sh run showing
    counts and details of installed packages, skipped packages, linked dotfiles,
    skipped dotfiles, and any warnings.

  problem_statement: |
    After a provisioning run, it is hard to tell at a glance what actually happened
    versus what was skipped. Users must scroll through the full log to find out if
    anything went wrong or was skipped. This is especially painful on first runs
    where many packages are installed and output is long.

  proposed_solution: |
    install.sh accumulates counters and arrays throughout the run:
    - INSTALLED_PACKAGES[], SKIPPED_PACKAGES[], LINKED_DOTFILES[], SKIPPED_DOTFILES[], WARNINGS[]
    At the end of a successful run, a summary section is printed using these arrays.
    The summary is always printed, even if individual steps produced warnings.
    On error (exit 1), a partial summary is printed showing what completed before failure.

  out_of_scope:
    - "Machine-readable output (JSON/CSV) — future spec"
    - "Persisting run history to a file (see FEAT-0012 for log-to-file)"

  dependencies:
    - "FEAT-0001: Core provisioning engine"

acceptance_criteria:
  - id: "AC-001"
    given: "A successful provisioning run"
    when: "install.sh completes"
    then: "A summary is printed with the following sections:"
    and:
      - "Packages installed: count and list of names"
      - "Packages skipped (already installed): count and list of names"
      - "Dotfiles linked: count and list of paths"
      - "Dotfiles skipped: count and list of paths with reason"
      - "Warnings: count and list (empty section omitted if zero warnings)"
      - "Total elapsed time"

  - id: "AC-002"
    given: "A run where all packages are already installed and all dotfiles already linked"
    when: "install.sh completes"
    then: "Summary shows 0 installed, all counts in skipped columns, and exit 0"

  - id: "AC-003"
    given: "A run that fails mid-way (e.g. a package fails to install)"
    when: "install.sh exits 1"
    then: "A partial summary is printed showing what completed before the failure"
    and:
      - "Summary header reads 'Run incomplete — error occurred'"
      - "Exit code remains 1"

  - id: "AC-004"
    given: "A --dry-run invocation (FEAT-0005)"
    when: "install.sh --dry-run completes"
    then: "The summary shows 'Would install' and 'Would link' counts instead of 'Installed' and 'Linked'"

  - id: "AC-005"
    given: "A run with --quiet flag"
    when: "install.sh --quiet completes"
    then: "All per-step log_info lines are suppressed but the summary is still printed"

technical_requirements:
  constraints:
    - "Summary is implemented using global arrays populated by install/link functions"
    - "Uses trap EXIT to print partial summary even on unexpected exits"
    - "Elapsed time measured with SECONDS bash built-in"

testing_requirements:
  unit_tests: false
  integration_tests: false
  e2e_tests: true
  test_scenarios:
    - "First run: installed count matches number of packages in profile"
    - "Second run: skipped count matches, installed count is 0"
    - "Summary contains correct dotfile link/skip counts"
    - "Partial summary is printed on failure"
    - "--quiet suppresses step output but not summary"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    Summary is output-only. No rollback needed.
