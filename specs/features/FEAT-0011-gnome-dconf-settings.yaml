# Feature Specification: GNOME/dconf Settings
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0011"
  title: "GNOME / dconf Settings"
  version: "1.0.0"
  status: "draft"
  priority: "low"
  author: "Jerry"
  created_at: "2026-02-25"
  updated_at: "2026-02-25"
  tags:
    - gnome
    - dconf
    - desktop
    - configuration

description:
  summary: |
    Apply declarative GNOME desktop settings from a dconf dump file stored in the
    repo, as part of the desktop and dev profiles.

  problem_statement: |
    After provisioning a desktop machine, all GNOME settings (dark mode, keybindings,
    dock position, night light, keyboard layout, etc.) are at Ubuntu defaults. These
    take significant time to reconfigure manually and the exact settings are not
    reproducible across reinstalls. GNOME stores these settings in dconf, which
    supports import/export via 'dconf dump' and 'dconf load'.

  proposed_solution: |
    Store a dconf dump file at dotfiles/gnome/dconf-settings.ini in the repo.
    A src/gnome.sh script applies it with 'dconf load / < dconf-settings.ini'.
    This is only run on desktop/dev profiles (guarded by checking $XDG_CURRENT_DESKTOP).
    The dump file is generated from the developer's current settings via a helper
    script (src/export-gnome-settings.sh) and committed to the repo.
    Re-applying is idempotent (dconf load is a full replace of the keyed paths).

  out_of_scope:
    - "Non-GNOME desktop environments (KDE, XFCE, etc.)"
    - "GNOME extensions installation (separate spec)"
    - "Per-application settings beyond what dconf covers"

  dependencies:
    - "FEAT-0001: Core provisioning engine"

acceptance_criteria:
  - id: "AC-001"
    given: "A desktop or dev profile and a GNOME session ($XDG_CURRENT_DESKTOP=GNOME)"
    when: "./install.sh --profile desktop is run"
    then: "dconf load / < dotfiles/gnome/dconf-settings.ini is executed"
    and:
      - "log_step 'Applying GNOME settings' is printed"
      - "After the run, 'dconf read /org/gnome/desktop/interface/color-scheme' returns the expected value from the dump file"

  - id: "AC-002"
    given: "A base or server profile (no GNOME session)"
    when: "./install.sh is run"
    then: "GNOME settings step is skipped entirely"
    and:
      - "If $XDG_CURRENT_DESKTOP is not GNOME (or is unset), a log_info is printed: 'Not a GNOME session, skipping dconf settings'"

  - id: "AC-003"
    given: "dotfiles/gnome/dconf-settings.ini does not exist in the repo"
    when: "./install.sh --profile desktop is run"
    then: "log_warn is printed: 'No GNOME settings file found at dotfiles/gnome/dconf-settings.ini — skipping'"
    and:
      - "Provisioning continues; this is not a fatal error"

  - id: "AC-004"
    given: "src/export-gnome-settings.sh is run on a configured GNOME machine"
    when: "The script completes"
    then: "dotfiles/gnome/dconf-settings.ini is created/updated with the current dconf dump"
    and:
      - "The file can be committed to git and used by install.sh on the next provisioning run"

  - id: "AC-005"
    given: "dconf settings have been applied"
    when: "./install.sh --profile desktop is run again"
    then: "dconf load runs again (it is idempotent by nature) and exits 0"

technical_requirements:
  constraints:
    - "dconf and gsettings must be available — both are present in a standard Ubuntu GNOME session"
    - "Must not run in a headless/server environment (no $DISPLAY or $WAYLAND_DISPLAY)"
    - "dconf load replaces only the keys present in the dump file; other settings are untouched"

  security:
    - "dconf settings are user-scoped — no sudo required"
    - "The dump file is reviewed before being committed; no sensitive data should be in dconf"

testing_requirements:
  unit_tests: false
  integration_tests: false
  e2e_tests: true
  test_scenarios:
    - "GNOME session: dconf settings applied and verifiable via dconf read"
    - "Non-GNOME / headless: step skipped with log_info"
    - "Missing dconf-settings.ini: warning shown, provisioning continues"
    - "export-gnome-settings.sh produces a valid dconf dump file"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    dconf settings can be reset to defaults: dconf reset -f /
    Or re-apply Ubuntu defaults by logging out and resetting via GNOME Settings.
    The dconf-settings.ini in the repo can be updated with the correct values and re-applied.
