# Feature Specification: Connectivity Check
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0014"
  title: "Connectivity Check"
  version: "1.0.0"
  status: "draft"
  priority: "medium"
  author: "Jerry"
  created_at: "2026-02-25"
  updated_at: "2026-02-25"
  tags:
    - safety
    - networking
    - ux

description:
  summary: |
    Before executing any package installs or downloads, verify internet connectivity
    and exit early with a clear message if the system is offline.

  problem_statement: |
    When install.sh is run without internet access, it fails deep into the run with
    cryptic apt or wget errors after spending time on steps that don't need the
    network. This is confusing, leaves the system partially provisioned, and wastes
    time. A fast upfront check eliminates this failure class entirely.

  proposed_solution: |
    At the start of install.sh (after validation, before any installs), run a
    check_connectivity() function in scripts/utils.sh that pings a reliable host
    (e.g. 1.1.1.1 or 8.8.8.8) with a short timeout. If it fails, print a clear
    error and exit 1. If the profile contains only dotfiles (no network packages),
    the check is skipped automatically.
    A --skip-connectivity-check flag bypasses this for air-gapped or offline use cases
    where packages are already cached by apt.

  out_of_scope:
    - "Testing connectivity to specific registries (apt mirrors, snap store, etc.)"
    - "Automatic retry or waiting for connectivity"
    - "Proxy configuration"

  dependencies:
    - "FEAT-0001: Core provisioning engine"

acceptance_criteria:
  - id: "AC-001"
    given: "A system with internet access"
    when: "install.sh is run"
    then: "Connectivity check passes silently and provisioning proceeds"
    and:
      - "Check completes in under 3 seconds"
      - "No output is printed on success (connectivity check is silent by default)"

  - id: "AC-002"
    given: "A system without internet access"
    when: "install.sh is run"
    then: "The script exits 1 with a clear message before any package installs"
    and:
      - "Message: 'No internet connectivity detected. Check your network and try again.'"
      - "Message includes: 'To skip this check (e.g. for air-gapped/cached installs): --skip-connectivity-check'"
      - "No apt, snap, flatpak, or wget commands have been run"

  - id: "AC-003"
    given: "install.sh is run with --skip-connectivity-check"
    when: "The run proceeds"
    then: "The connectivity check is skipped entirely and a log_warn is printed: 'Skipping connectivity check'"

  - id: "AC-004"
    given: "A profile that contains only dotfiles (no packages of any type)"
    when: "install.sh is run"
    then: "The connectivity check is skipped automatically (no network needed for symlinking)"

  - id: "AC-005"
    given: "install.sh --dotfiles-only is run"
    when: "The run proceeds"
    then: "The connectivity check is skipped (dotfiles-only requires no network)"

technical_requirements:
  constraints:
    - "Check uses 'curl -s --max-time 3 https://1.1.1.1' or 'ping -c 1 -W 2 1.1.1.1' — curl preferred as it tests HTTPS"
    - "Timeout must be 3 seconds or less to fail fast"
    - "Implemented as check_connectivity() in scripts/utils.sh"
    - "Runs after profile validation (FEAT-0006) and before apt-get update"

testing_requirements:
  unit_tests: false
  integration_tests: true
  e2e_tests: true
  test_scenarios:
    - "With network: check passes, provisioning runs"
    - "Without network (iptables block): exits 1 with clear message before any installs"
    - "--skip-connectivity-check: warning shown, proceeds without network"
    - "--dotfiles-only: connectivity check not run"
    - "Profile with no packages: connectivity check not run"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    Read-only operation. No rollback needed.
    If check is too aggressive, use --skip-connectivity-check as escape hatch.
