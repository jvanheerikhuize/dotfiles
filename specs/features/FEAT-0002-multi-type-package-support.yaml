# Feature Specification: Multi-Type Package Support
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0002"
  title: "Multi-Type Package Support"
  version: "1.0.0"
  status: "implemented"
  priority: "high"
  author: "Jerry"
  created_at: "2026-02-25"
  updated_at: "2026-02-25"
  tags:
    - packages
    - snap
    - flatpak
    - deb
    - custom

description:
  summary: |
    Extend src/packages.sh to support snap, flatpak, direct .deb URL downloads,
    and custom shell commands as package types in addition to the apt support from FEAT-0001.

  problem_statement: |
    Many tools used in a developer environment are not available via apt, or are better
    installed through other channels (e.g. VS Code via snap, GIMP via flatpak, GitHub CLI
    via a .deb release). Without multi-type support, profile YAML can only declare apt
    packages, leaving the rest to be installed manually.

  proposed_solution: |
    Add one install function per package type to src/packages.sh:
    - install_snap_package(): sudo snap install
    - install_flatpak_package(): flatpak install
    - install_deb_package(): wget to temp file + sudo dpkg -i, then cleanup
    - install_custom_package(): eval of a shell command string from the profile YAML
    Each function checks idempotency before installing. The profile YAML already has
    placeholders for all types; install.sh dispatches to the correct function by type.

  out_of_scope:
    - "AppImage support (separate spec)"
    - "Version pinning for snap or flatpak"
    - "Automatic snap/flatpak daemon setup (assumed to already be available post Stage 1)"

  dependencies:
    - "FEAT-0001: Core provisioning engine (install.sh, profile loading, package dispatcher)"

acceptance_criteria:
  - id: "AC-001"
    given: "A profiles/base.yaml with a snap package (e.g. 'lxd') listed under packages.snap"
    when: "./install.sh --profile base is run"
    then: "The package is installed via 'sudo snap install lxd'"
    and:
      - "log_info prints 'Installing (snap): lxd'"
      - "If already installed, snap list shows it and the step is skipped with log_info 'Already installed: lxd'"

  - id: "AC-002"
    given: "A profile with a flatpak package (e.g. 'org.gimp.GIMP') listed under packages.flatpak"
    when: "./install.sh --profile desktop is run"
    then: "The package is installed via 'flatpak install -y flathub org.gimp.GIMP'"
    and:
      - "If flatpak is not installed, the script first installs flatpak via apt and adds the flathub remote"
      - "If already installed, flatpak list shows it and the step is skipped"

  - id: "AC-003"
    given: "A profile with a deb entry containing a URL to a .deb file"
    when: "./install.sh is run"
    then: "The .deb is downloaded to a temp directory, installed with 'sudo dpkg -i', and the temp file is deleted"
    and:
      - "If the package (as reported by dpkg -s) is already installed, the download and install are skipped"
      - "If the download fails (bad URL, no connectivity), the script exits non-zero with a clear error"

  - id: "AC-004"
    given: "A profile with a custom entry containing a shell command string"
    when: "./install.sh is run"
    then: "The shell command is executed via bash -c"
    and:
      - "If the command exits non-zero, install.sh exits non-zero with the command and error output shown"
      - "The profile YAML custom entry supports an optional 'idempotency_check' shell command; if provided and exits 0, the custom step is skipped"

  - id: "AC-005"
    given: "A profile with packages of multiple types (apt, snap, flatpak)"
    when: "./install.sh is run"
    then: "Types are installed in order: apt → snap → flatpak → deb → custom"
    and:
      - "A log_step header is printed before each type section"
      - "Empty type lists produce no output and no errors"

technical_requirements:
  constraints:
    - "snap must be available; if not, the script exits with instructions to install it"
    - "flatpak remote 'flathub' is added automatically if not present"
    - "deb downloads use a mktemp temp directory cleaned up via trap on EXIT"
    - "custom commands run in a subshell (bash -c) so they cannot affect the parent script's environment"

  security:
    - "deb URLs must be https; http URLs produce a log_warn and require --force to proceed"
    - "custom commands are run as the current user; the profile author is responsible for auditing them"
    - "no credentials are stored; deb downloads are unauthenticated unless the URL embeds a token (not recommended)"

testing_requirements:
  unit_tests: true
  integration_tests: true
  e2e_tests: true
  test_scenarios:
    - "snap install of a real package (e.g. hello) succeeds on clean Ubuntu 22.04"
    - "snap install is skipped when already installed"
    - "flatpak install of a real package succeeds after flathub remote is added"
    - "deb install: download + install + temp cleanup all succeed"
    - "deb install: bad URL exits non-zero with clear message"
    - "custom command that exits 0 succeeds"
    - "custom command that exits 1 causes install.sh to exit non-zero"
    - "custom command with idempotency_check that exits 0 is skipped"
    - "mixed profile installs all types in correct order"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    Package installs are not rolled back. Remove unwanted packages manually.
    No changes to system files outside of installed packages.
