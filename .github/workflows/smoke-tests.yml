name: Smoke Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  smoke-test:
    name: Docker smoke tests (base profile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run smoke tests
        # --use-cache allows Docker layer caching in CI for faster runs.
        # The clean-state guarantee comes from each scenario running in a
        # fresh container (docker run --rm) from the same built image.
        run: bash tests/smoke/run-tests.sh --use-cache
