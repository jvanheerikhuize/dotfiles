# GNOME settings loaded by install.sh with `dconf load /` for profiles that
# include `desktop`. Exported from the reference machine on 2026-11-17.
# Re-export a section with: dconf dump /org/gnome/desktop/interface/

[org/gnome/desktop/interface]
accent-color='brown'
color-scheme='prefer-dark'
gtk-theme='Yaru-wartybrown-dark'
icon-theme='Yaru-wartybrown-dark'
show-battery-percentage=true
text-scaling-factor=1.25

[org/gnome/shell/extensions/dash-to-dock]
dash-max-icon-size=42
dock-fixed=false
dock-position='BOTTOM'
extend-height=false

[org/gnome/shell/extensions/tiling-assistant]
active-window-hint-color='rgb(211,70,21)'
focus-hint-color='rgb(218,52,80)'
tiling-popup-all-workspace=true
