# Base profile — applied to every machine regardless of role.
# Contains essential CLI tools only. No GUI apps.
profile:
  name: base
  extends: null

packages:
  apt:
    # HTTP clients
    - curl
    - wget

    # Version control
    - git

    # Editors
    - vim

    # System monitoring
    - htop

    # File utilities
    - tree
    - unzip
    - zip
    - rsync

    # Nicer everyday CLI (triage 2026-11-17)
    - bat           # cat with highlighting; the command is `batcat` on Ubuntu
    - eza           # modern ls
    - fzf           # fuzzy finder

    # Disk usage
    - duf
    - ncdu

    # Hardware health (triage 2026-11-17)
    - nvme-cli
    - smartmontools
    - lm-sensors
    - powertop

    # Cloud storage sync (personal-data stage depends on it)
    - rclone

    # JSON / text processing
    - jq

    # Build tools
    - build-essential

    # Python
    - python3-pip
    - python3-venv

    # apt infrastructure (for adding third-party repos in later specs)
    - software-properties-common
    - apt-transport-https
    - ca-certificates
    - gnupg

    # Network utilities
    - net-tools
    - bind9-dnsutils          # dig, nslookup; dnsutils is only a virtual name

    # SSH client (provides ssh, ssh-keygen, ssh-copy-id)
    - openssh-client

    # Terminal multiplexer
    - tmux

    # Shell linter
    - shellcheck

  snap: []
  flatpak: []
  deb: []
  custom: []
