# Desktop profile — GUI workstation tools.
# Extends base; adds graphical applications. GUI apps are Flatpak-first
# (decision 2026-11-16); apt only where the app needs system integration.
profile:
  name: desktop
  extends: base

packages:
  apt:
    # GNOME customisation
    - gnome-tweaks
    - dconf-editor
    - gnome-shell-extension-manager

    # Terminal
    - alacritty

    # Clipboard from the command line
    - xclip

    # Audio and video
    - pavucontrol
    - ffmpeg
    - handbrake-cli

    # Fonts
    - fonts-firacode

    # Disk management
    - gparted

    # FTP and installers
    - gftp
    - curlftpfs
    - innoextract

    # Needed to run AppImages (ElegooSlicer below)
    - libfuse2t64

  snap: []

  flatpak:
    - com.google.Chrome
    - org.signal.Signal
    - org.videolan.VLC
    - org.inkscape.Inkscape
    - org.kde.krita
    - org.libreoffice.LibreOffice
    - com.spotify.Client
    - com.transmissionbt.Transmission
    - org.gnome.Cheese
    - org.raspberrypi.rpi-imager

  deb: []

  custom:
    - cmd: >-
        mkdir -p "$HOME/.local/bin" &&
        curl -fL -o "$HOME/.local/bin/ElegooSlicer.AppImage"
        https://github.com/elegooofficial/ElegooSlicer/releases/download/v1.5.3.5/ElegooSlicer_Linux_V1.5.3.5.AppImage &&
        chmod +x "$HOME/.local/bin/ElegooSlicer.AppImage"
      idempotency_check: test -x "$HOME/.local/bin/ElegooSlicer.AppImage"
